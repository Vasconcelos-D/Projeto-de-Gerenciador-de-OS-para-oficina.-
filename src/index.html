<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RG Serviços Elétricos</title>
    <link rel="stylesheet" href="output.css">
    <link rel="stylesheet" href="style-custom.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body class="bg-gray-100">

    <div class="flex min-h-screen">


        <!--Inicío do Sidbar-->
        <aside class="w-72 bg-gray-700 text-white p-5 shadow-xl">
            <div class="mb-4">
                <img src="img/rg.jpg" alt="Logo" class="w-12 h-12  rounded-full bg-green-50 p-2 "> 
            </div>
            <div class="mb-8">
                
                <h1 class="text-2xl font-bold">
                    Sistema Rio Grande
                </h1>
                <p class="text-sm text-gray-300">
                    Painel Adiministrativo
                </p>
            </div>
            <!-- Fim da  Logo -->

            <nav class=" space-y-3">
                <a href="#" class="block rounded-xl hover:bg-zinc-600 transition   p-3  hover:scale-105">
                    <span class="icon-3d mr-2"><i class="fas fa-tachometer-alt"></i></span>
                    Dashboard
                </a>
                <a href="#" class="block rounded-xl hover:bg-zinc-600 transition   p-3  hover:scale-105">
                    <span class="icon-3d mr-2"><i class="fas fa-users"></i></span>
                    Clientes
                </a>

                <a href="#" class="block rounded-xl hover:bg-zinc-600 transition   p-3  hover:scale-105">
                    <span class="icon-3d mr-2"><i class="fas fa-car"></i></span>
                    Veiculos
                </a>
                <a href="#" class="block rounded-xl hover:bg-zinc-600 transition   p-3  hover:scale-105">
                    <span class="icon-3d mr-2"><i class="fas fa-dollar-sign"></i></span>
                    Finanças
                </a>
                <a href="#" class="block rounded-xl hover:bg-zinc-600 transition   p-3  hover:scale-105">
                    <span class="icon-3d mr-2"><i class="fas fa-boxes"></i></span>
                    Estoque
                </a>
            </nav>
            <!-- Menu Fim -->

        </aside>
        <main class="flex-1 p-8">
            <!--Inicio da Header-->
            <header class="mb-8">
                <h2 class="text-3xl font-bold text-gray-800">
                    Dashboard
                </h2>
                <p class="text-gray-500">
                    Bem-vindo ao sistema da oficina R-G !
                </p>
            </header>
            <!--Fim da Header-->
            <!--Cards Inicio-->
            <section class=" grid md:grid-cols-3 gap-6">

                <div class="bg-white p-6 rounded-2xl shadow-2xl">
                    <div class="flex items-center gap-3 mb-4">
                        <span class="card-icon"><i class="fas fa-users"></i></span>
                        <h3 class="text-gray-500">Clientes</h3>
                    </div>
                    <p class="text-3xl font-bold"> 152</p>
                </div>
                <div class="bg-white p-6 rounded-2xl shadow-2xl">
                    <div class="flex items-center gap-3 mb-4">
                        <span class="card-icon"><i class="fas fa-car"></i></span>
                        <h3 class="text-gray-500">Veiculos</h3>
                    </div>
                    <p class="text-3xl font-bold"> 89</p>
                </div>
                <div class="bg-white p-6 rounded-2xl shadow-2xl">
                    <div class="flex items-center gap-3 mb-4">
                        <span class="card-icon"><i class="fas fa-tools"></i></span>
                        <h3 class="text-gray-500">Serviços Hoje</h3>
                    </div>
                    <p class="text-3xl font-bold"> 14</p>
                </div>
            </section>
            <!--Cards Fim-->


        </main>


    </div>
    <!--
    <footer>
        <div>
            <br><br><br><br><br>
        </div>
    </footer>
    -->
</body>

</html>
